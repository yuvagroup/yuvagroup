<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuva Group</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0f172a;
 color:#fff;
 overflow-x:hidden;
}

/* 🔵 LOADER */
#loader{
 position:fixed;
 width:100%;
 height:100%;
 background:#0f172a;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:9999;
}

.loader-circle{
 width:60px;
 height:60px;
 border:6px solid #444;
 border-top:6px solid #00bcd4;
 border-radius:50%;
 animation:spin 1s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg);}
}

/* 🌌 BACKGROUND ANIMATION */
.bg{
 position:fixed;
 width:100%;
 height:100%;
 overflow:hidden;
 z-index:-1;
}

.bg span{
 position:absolute;
 width:4px;
 height:4px;
 background:white;
 opacity:0.5;
 animation:move 20s linear infinite;
}

@keyframes move{
 from{transform:translateY(0);}
 to{transform:translateY(-100vh);}
}

/* container */
.container{
 position:relative;
 display:inline-block;
 max-width:1200px;
 width:100%;
 margin-top:40px;
 animation:fadeIn 1s ease;
}

@keyframes fadeIn{
 from{opacity:0; transform:translateY(20px);}
 to{opacity:1;}
}

.container img{
 width:100%;
 border-radius:20px;
 box-shadow:0 10px 40px rgba(0,0,0,0.4);
}

/* hotspots */
.hotspot{
 position:absolute;
 border-radius:12px;
 cursor:pointer;
 transition:0.3s;
}

/* hover */
.hotspot:hover{
 background:rgba(255,255,255,0.15);
 transform:scale(1.08);
}

/* CLICK ZOOM */
.hotspot:active{
 transform:scale(1.2);
}

/* tooltip */
.hotspot::after{
 content:attr(data-name);
 position:absolute;
 bottom:110%;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 10px;
 border-radius:6px;
 font-size:12px;
 opacity:0;
 transition:0.3s;
}

.hotspot:hover::after{
 opacity:1;
}

/* positions */
#ytrip{ top:6%; left:43%; width:14%; height:16%; }
#b2bfare{ top:14%; left:4%; width:18%; height:18%; }
#yuvento{ top:14%; right:5%; width:16%; height:18%; }
#pigeon{ bottom:12%; left:5%; width:20%; height:22%; }
#hikeup{ bottom:10%; left:42%; width:16%; height:20%; }
#yuva-cares{ bottom:10%; right:5%; width:20%; height:22%; }

/* CONTACT SECTION */
.contact{
 margin:60px auto;
 max-width:800px;
 background:#111827;
 padding:30px;
 border-radius:15px;
 box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.contact h2{
 margin-bottom:20px;
}

.contact input, .contact textarea{
 width:100%;
 padding:12px;
 margin:10px 0;
 border:none;
 border-radius:8px;
}

.contact button{
 padding:12px 20px;
 background:#00bcd4;
 color:white;
 border:none;
 border-radius:8px;
 cursor:pointer;
}

/* mobile */
@media(max-width:768px){
 #ytrip{width:18%; height:18%;}
 #b2bfare{width:22%; height:22%;}
 #yuvento{width:20%; height:22%;}
 #pigeon{width:24%; height:24%;}
 #hikeup{width:20%; height:22%;}
 #yuva-cares{width:24%; height:24%;}
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
 <div class="loader-circle"></div>
</div>

<!-- BACKGROUND -->
<div class="bg" id="bg"></div>

<!-- MAIN IMAGE -->
<div class="container">
<img src="yuva-group.jpg">

<a class="hotspot" id="ytrip" href="https://ytrip.in" target="_blank" data-name="Ytrip"></a>
<a class="hotspot" id="b2bfare" href="https://b2bfare.com" target="_blank" data-name="B2BFare"></a>
<a class="hotspot" id="yuvento" href="https://yuvento.com" target="_blank" data-name="Yuvento"></a>
<a class="hotspot" id="pigeon" href="https://pigeonst.com" target="_blank" data-name="Pigeon Street"></a>
<a class="hotspot" id="hikeup" href="https://hikeup.biz" target="_blank" data-name="HikeUp"></a>
<a class="hotspot" id="yuva-cares" href="https://yuvacares.com" target="_blank" data-name="Yuva Cares"></a>
</div>

<!-- CONTACT -->
<div class="contact">
<h2>Contact Us</h2>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea rows="4" placeholder="Message"></textarea>
<button>Send Message</button>
</div>

<script>
/* remove loader */
window.onload = () => {
 document.getElementById("loader").style.display = "none";
};

/* generate background particles */
const bg = document.getElementById("bg");
for(let i=0;i<40;i++){
 let span=document.createElement("span");
 span.style.left=Math.random()*100+"%";
 span.style.top=Math.random()*100+"%";
 span.style.animationDuration=(10+Math.random()*20)+"s";
 bg.appendChild(span);
}
</script>

</body>
</html>
