<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuva Group</title>

<style>
body{
 margin:0;
 background:linear-gradient(135deg,#f5f5f5,#eaeaea);
 text-align:center;
 font-family:Arial;
}

.container{
 position:relative;
 display:inline-block;
 max-width:1200px;
 width:100%;
 animation:fadeIn 1s ease;
}

@keyframes fadeIn{
 from{opacity:0; transform:translateY(20px);}
 to{opacity:1; transform:translateY(0);}
}

.container img{
 width:100%;
 border-radius:20px;
 box-shadow:0 10px 40px rgba(0,0,0,0.15);
}

/* hotspots */
.hotspot{
 position:absolute;
 border-radius:12px;
 transition:0.3s;
 cursor:pointer;
}

.hotspot:hover{
 background:rgba(255,255,255,0.2);
 box-shadow:0 0 20px rgba(0,0,0,0.3);
 transform:scale(1.05);
}

/* tooltip */
.hotspot::after{
 content:attr(data-name);
 position:absolute;
 bottom:110%;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 color:#fff;
 padding:5px 10px;
 border-radius:6px;
 font-size:12px;
 opacity:0;
 transition:0.3s;
}

.hotspot:hover::after{
 opacity:1;
}

/* positions */
#ytrip{ top:6%; left:43%; width:14%; height:16%; }
#b2bfare{ top:14%; left:4%; width:18%; height:18%; }
#yuvento{ top:14%; right:5%; width:16%; height:18%; }
#pigeon{ bottom:12%; left:5%; width:20%; height:22%; }
#hikeup{ bottom:10%; left:42%; width:16%; height:20%; }
#yuva-cares{ bottom:10%; right:5%; width:20%; height:22%; }

</style>
</head>

<body>

<div class="container">
<img src="yuva-group.jpg">

<a class="hotspot" id="ytrip" href="https://ytrip.in" target="_blank" data-name="Ytrip"></a>
<a class="hotspot" id="b2bfare" href="https://b2bfare.com" target="_blank" data-name="B2BFare"></a>
<a class="hotspot" id="yuvento" href="https://yuvento.com" target="_blank" data-name="Yuvento"></a>
<a class="hotspot" id="pigeon" href="https://pigeonst.com" target="_blank" data-name="Pigeon Street"></a>
<a class="hotspot" id="hikeup" href="https://hikeup.biz" target="_blank" data-name="HikeUp"></a>
<a class="hotspot" id="yuva-cares" href="https://yuvacares.com" target="_blank" data-name="Yuva Cares"></a>

</div>

</body>
</html>
