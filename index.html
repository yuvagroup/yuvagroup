<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuva Group</title>

<style>
body{
 margin:0;
 font-family:Arial;
 background:#0f172a;
 color:#fff;
 overflow-x:hidden;
}

/* LOADER */
#loader{
 position:fixed;
 width:100%;
 height:100%;
 background:#0f172a;
 display:flex;
 justify-content:center;
 align-items:center;
 z-index:9999;
}

.loader-circle{
 width:60px;
 height:60px;
 border:6px solid #444;
 border-top:6px solid #00bcd4;
 border-radius:50%;
 animation:spin 1s linear infinite;
}

@keyframes spin{
 to{transform:rotate(360deg);}
}

/* BACKGROUND */
.bg{
 position:fixed;
 width:100%;
 height:100%;
 z-index:-1;
 overflow:hidden;
}

.bg span{
 position:absolute;
 width:4px;
 height:4px;
 background:white;
 opacity:0.5;
 animation:move 20s linear infinite;
}

@keyframes move{
 from{transform:translateY(0);}
 to{transform:translateY(-100vh);}
}

/* CONTAINER */
.container{
 position:relative;
 display:inline-block;
 max-width:1200px;
 width:100%;
 margin-top:40px;
 transition:transform 0.2s ease;
}

/* LOGO IMAGE */
.container img{
 width:100%;
 border-radius:20px;
 box-shadow:0 10px 40px rgba(0,0,0,0.4);

 opacity:0;
 transform:scale(1.1);
 filter:blur(10px);

 animation:
  logoReveal 1.5s ease forwards,
  glowPulse 2s ease 2s;
}

@keyframes logoReveal{
 to{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
 }
}

@keyframes glowPulse{
 0%{box-shadow:0 0 0 rgba(0,188,212,0);}
 50%{box-shadow:0 0 40px rgba(0,188,212,0.6);}
 100%{box-shadow:0 0 0 rgba(0,188,212,0);}
}

/* HOTSPOTS */
.hotspot{
 position:absolute;
 border-radius:12px;
 cursor:pointer;
 transition:0.3s;

 opacity:0;
 transform:translateY(20px);
 animation:hotspotFade 0.6s ease forwards;
}

@keyframes hotspotFade{
 to{
  opacity:1;
  transform:translateY(0);
 }
}

.hotspot:hover{
 background:rgba(255,255,255,0.15);
 transform:scale(1.08);
}

.hotspot:active{
 transform:scale(1.2);
}

/* TOOLTIP */
.hotspot::after{
 content:attr(data-name);
 position:absolute;
 bottom:110%;
 left:50%;
 transform:translateX(-50%);
 background:#000;
 padding:6px 10px;
 border-radius:6px;
 font-size:12px;
 opacity:0;
 transition:0.3s;
}

.hotspot:hover::after{
 opacity:1;
}

/* HOTSPOT POSITIONS */
#ytrip{ top:6%; left:43%; width:14%; height:16%; animation-delay:1.2s;}
#b2bfare{ top:14%; left:4%; width:18%; height:18%; animation-delay:1.4s;}
#yuvento{ top:14%; right:5%; width:16%; height:18%; animation-delay:1.6s;}
#pigeon{ bottom:12%; left:5%; width:20%; height:22%; animation-delay:1.8s;}
#hikeup{ bottom:10%; left:42%; width:16%; height:20%; animation-delay:2s;}
#yuva-cares{ bottom:10%; right:5%; width:20%; height:22%; animation-delay:2.2s;}

/* GLASS OVERLAY */
.overlay{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 text-align:center;
 background:rgba(255,255,255,0.1);
 padding:20px 30px;
 border-radius:15px;
 backdrop-filter:blur(10px);
 box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.overlay h1{
 margin:0;
 font-size:32px;
}

.overlay p{
 margin-top:8px;
 font-size:14px;
 opacity:0.8;
}

/* CONTACT */
.contact{
 margin:60px auto;
 max-width:800px;
 background:#111827;
 padding:30px;
 border-radius:15px;
 box-shadow:0 0 30px rgba(0,0,0,0.5);
}

.contact input, .contact textarea{
 width:100%;
 padding:12px;
 margin:10px 0;
 border:none;
 border-radius:8px;
}

.contact button{
 padding:12px 20px;
 background:#00bcd4;
 color:white;
 border:none;
 border-radius:8px;
 cursor:pointer;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
 <div class="loader-circle"></div>
</div>

<!-- BACKGROUND -->
<div class="bg" id="bg"></div>

<!-- MAIN -->
<div class="container">
<img src="yuva-group.jpg">

<div class="overlay">
  <h1>Yuva Group</h1>
  <p>15 Years of Commitment • Countless Milestones</p>
</div>

<a class="hotspot" id="ytrip" href="https://ytrip.in" target="_blank" data-name="Ytrip"></a>
<a class="hotspot" id="b2bfare" href="https://b2bfare.com" target="_blank" data-name="B2BFare"></a>
<a class="hotspot" id="yuvento" href="https://yuvento.com" target="_blank" data-name="Yuvento"></a>
<a class="hotspot" id="pigeon" href="https://pigeonst.com" target="_blank" data-name="Pigeon Street"></a>
<a class="hotspot" id="hikeup" href="https://hikeup.biz" target="_blank" data-name="HikeUp"></a>
<a class="hotspot" id="yuva-cares" href="https://yuvacares.com" target="_blank" data-name="Yuva Cares"></a>
</div>

<!-- CONTACT -->
<div class="contact">
<h2>Contact Us</h2>
<input type="text" placeholder="Your Name">
<input type="email" placeholder="Your Email">
<textarea rows="4" placeholder="Message"></textarea>
<button>Send Message</button>
</div>

<script>
window.onload = () => {
 document.getElementById("loader").style.display = "none";
};

const bg = document.getElementById("bg");
for(let i=0;i<40;i++){
 let span=document.createElement("span");
 span.style.left=Math.random()*100+"%";
 span.style.top=Math.random()*100+"%";
 span.style.animationDuration=(10+Math.random()*20)+"s";
 bg.appendChild(span);
}

/* PARALLAX */
const container = document.querySelector(".container");

container.addEventListener("mousemove", (e) => {
 const rect = container.getBoundingClientRect();
 const x = (e.clientX - rect.left) / rect.width - 0.5;
 const y = (e.clientY - rect.top) / rect.height - 0.5;
 container.style.transform = `rotateX(${y * 5}deg) rotateY(${x * 5}deg)`;
});

container.addEventListener("mouseleave", () => {
 container.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>

</body>
</html>
