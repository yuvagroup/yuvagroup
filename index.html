<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yuva Group</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
}

.hero{
padding:40px 20px;
}

.hero img{
max-width:900px;
width:95%;
border-radius:20px;
box-shadow:0 8px 30px rgba(0,0,0,.12);
}

h2{
margin-top:50px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
max-width:1100px;
margin:40px auto 70px;
padding:20px;
}

.card{
background:white;
padding:35px 25px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);
text-decoration:none;
color:#222;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 12px 35px rgba(0,0,0,.15);
}

.card h3{
margin-bottom:10px;
}

.footer{
padding:30px;
color:#666;
}
</style>
</head>
<body>

<section class="hero">
<img src="yuva-group.jpg" alt="Yuva Group">
</section>

<h2>Our Companies</h2>

<div class="grid">

<a class="card" href="https://ytrip.in" target="_blank">
<h3>Ytrip</h3>
<p>Travel Services</p>
</a>

<a class="card" href="https://b2bfare.com" target="_blank">
<h3>B2BFare</h3>
<p>Flight & Booking Solutions</p>
</a>

<a class="card" href="https://yuvento.com" target="_blank">
<h3>Juvento</h3>
<p>Brand Division</p>
</a>

<a class="card" href="https://pigeonst.com" target="_blank">
<h3>Pigeon Street</h3>
<p>Media & Creative</p>
</a>

<a class="card" href="https://hikeup.biz" target="_blank">
<h3>HikeUp</h3>
<p>Digital Growth</p>
</a>

<a class="card" href="https://yuvacares.com" target="_blank">
<h3>Yuva Cares</h3>
<p>Community Initiative</p>
</a>

</div>

<div class="footer">
“15 years of commitment, countless milestones”
</div>

</body>
</html>
